<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso DECAS</title>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="margin: 0; padding: 20px; background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; text-align: center;">

  <div style="background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); border: 1px solid #e1e6eb; max-width: 420px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto;">
    
    <!-- LOGO TECNOFLOTAS -->
    <div style="width: 100%; max-width: 180px; margin: 0 auto 20px auto; text-align: center;">
      <svg viewBox="0 0 200 65" width="180" height="58" style="max-width: 100%; height: auto; display: block; margin: 0 auto;" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="22" r="18" fill="none" stroke="#0B3B82" stroke-width="2.5"/>
        <ellipse cx="100" cy="22" rx="9" ry="18" fill="none" stroke="#0B3B82" stroke-width="2"/>
        <line x1="82" y1="22" x2="118" y2="22" stroke="#0B3B82" stroke-width="2"/>
        <path d="M 80 46 L 120 46" fill="none" stroke="#E85D22" stroke-width="3.5" stroke-linecap="round"/>
        <text x="100" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#0B3B82">TECNO<tspan fill="#E85D22">FLOTAS</tspan></text>
      </svg>
    </div>

    <!-- TITULO Y TEXTO -->
    <h2 style="color: #0b3b82; font-size: 20px; font-weight: 700; margin: 0 0 10px 0; text-align: center; width: 100%;">Acceso al Portal DECAS</h2>
    
    <p id="statusText" style="color: #516173; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; text-align: center; width: 100%;">Conectando de forma segura. Se abrirá una nueva ventana en unos segundos...</p>

    <!-- CARGADOR ANIMADO -->
    <div id="spinner" style="width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top: 4px solid #0b3b82; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px auto;"></div>

    <!-- BOTÓN MANUAL (Transformado a <button> puro) -->
    <button type="button" id="directLink" style="display: inline-block; background-color: #0b3b82; color: #ffffff; border: none; padding: 12px 24px; font-size: 14px; font-weight: 600; border-radius: 6px; box-shadow: 0 4px 10px rgba(11, 59, 130, 0.2); text-align: center; margin: 0 auto; cursor: pointer;">
      Abrir Portal Manualmente
    </button>

    <!-- PIE DE PÁGINA -->
    <div style="margin-top: 24px; font-size: 12px; color: #94a3b8; text-align: center; width: 100%;">Tecnoflotas Telematics Solutions</div>

  </div>

  <script>
    const TARGET_URL = 'https://dcdt.davinchi.es/Account/Login';

    function openPortal() {
      window.open(TARGET_URL, '_blank', 'noopener,noreferrer');
      
      setTimeout(() => {
        const spinner = document.getElementById('spinner');
        if (spinner) {
          spinner.style.display = 'none';
        }
        const statusText = document.getElementById('statusText');
        if (statusText) {
          statusText.textContent = 'Si no se ha abierto la pestaña automáticamente, utiliza el siguiente botón:';
        }
      }, 2500);
    }

    geotab.addin.portalDecas = function () {
      return {
        initialize: function (api, state, initializeCallback) {
          document.getElementById('directLink').addEventListener('click', function (e) {
            e.preventDefault();
            openPortal();
          });
          initializeCallback();
        },
        focus: function (api, state) {
          setTimeout(openPortal, 400);
        },
        blur: function (api, state) {}
      };
    };
  </script>
</body>
</html>
