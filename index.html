<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso DECAS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
      max-width: 420px;
      width: 90%;
      border: 1px solid #e2e8f0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #64748b;
    }
    .progress-container {
      width: 100%;
      background-color: #f1f5f9;
      height: 6px;
      border-radius: 4px;
      overflow: hidden;
      margin: 1.5rem 0 1.2rem 0;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fallback-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.825rem;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .fallback-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h2>Conectando con Portal DECAS</h2>
    <p>Redirigiendo al sistema de inicio de sesión...</p>
    
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <a href="https://dcdt.davinchi.es/Account/Login" target="_blank" id="manualLink" class="fallback-link">
      ¿No se ha abierto automáticamente? Haz clic aquí
    </a>
  </div>

  <script>
    const TARGET_URL = "https://dcdt.davinchi.es/Account/Login";

    function executeRedirect() {
      const progressBar = document.getElementById('progressBar');
      if (progressBar) {
        progressBar.style.width = '100%';
      }

      setTimeout(() => {
        // Opción recomendada: Abrir en pestaña nueva para evitar bloqueos de iframe
        window.open(TARGET_URL, '_blank');

        // Si se prefiere reemplazar toda la ventana actual de MyGeotab, usar:
        // window.top.location.href = TARGET_URL;
      }, 700);
    }

    // Integración del ciclo de vida del Add-In en MyGeotab
    geotab.addin.portalDecas = function () {
      return {
        initialize: function (api, state, callback) {
          callback();
        },
        focus: function (api, state) {
          executeRedirect();
        },
        blur: function (api, state) {}
      };
    };
  </script>
</body>
</html>
