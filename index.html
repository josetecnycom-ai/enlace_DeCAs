<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso DECAS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-align: center;
    }
    .card-container {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e1e6eb;
      max-width: 440px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      width: 100%;
    }
    .logo-container svg {
      width: 180px;
      height: auto;
    }
    h2 {
      color: #0b3b82;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
      width: 100%;
    }
    p {
      color: #516173;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }
    .spinner-loader {
      width: 36px;
      height: 36px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0b3b82;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 10px auto 24px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .btn-manual {
      display: inline-block;
      background-color: #0b3b82;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 10px rgba(11, 59, 130, 0.2);
      text-align: center;
    }
    .btn-manual:hover {
      background-color: #082a5e;
    }
    .footer-brand {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="logo-container">
      <svg viewBox="0 0 200 65" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="22" r="18" fill="none" stroke="#0B3B82" stroke-width="2.5"/>
        <ellipse cx="100" cy="22" rx="9" ry="18" fill="none" stroke="#0B3B82" stroke-width="2"/>
        <line x1="82" y1="22" x2="118" y2="22" stroke="#0B3B82" stroke-width="2"/>
        <path d="M 80 46 L 120 46" fill="none" stroke="#E85D22" stroke-width="3.5" stroke-linecap="round"/>
        <text x="100" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#0B3B82">TECNO<tspan fill="#E85D22">FLOTAS</tspan></text>
      </svg>
    </div>

    <h2>Acceso al Portal DECAS</h2>
    <p>Conectando de forma segura. Se abrirá una nueva ventana en unos segundos...</p>

    <div class="spinner-loader"></div>

    <a href="https://dcdt.davinchi.es/Account/Login" target="_blank" rel="noopener noreferrer" class="btn-manual" id="directLink">
      Abrir Portal Manualmente
    </a>

    <div class="footer-brand">Tecnoflotas Telematics Solutions</div>
  </div>

  <script>
    const TARGET_URL = 'https://dcdt.davinchi.es/Account/Login';

    function openPortal() {
      window.open(TARGET_URL, '_blank', 'noopener,noreferrer');
    }

    geotab.addin.portalDecas = function () {
      return {
        initialize: function (api, state, initializeCallback) {
          document.getElementById('directLink').addEventListener('click', openPortal);
          initializeCallback();
        },
        focus: function (api, state) {
          setTimeout(openPortal, 400);
        },
        blur: function (api, state) {}
      };
    };
  </script>
</body>
</html>
